name: Feature / Tool Request
description: Request a new tool or enhancement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Want a new tool or improvement? Describe it here. This project is **100% client-side** — tools that require server processing need extra discussion.
  - type: input
    id: title
    attributes:
      label: Tool / Feature Title
      placeholder: "e.g., Case Converter, CSV to Markdown, Audio Trimmer"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem / Use Case
      description: What problem does this solve? Who benefits?
      placeholder: "As a developer I need to..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: How should it work? Inputs, outputs, query params, raw output?
      placeholder: "Inputs: text + mode. Query params: ?text=hello&mode=upper. Raw: ?raw=text"
    validations:
      required: true
  - type: input
    id: clientside
    attributes:
      label: Can it be fully client-side?
      description: Can this be done with browser APIs / WASM (pdf-lib, ffmpeg, crypto-js, etc.) without uploads?
      placeholder: "Yes — via ... / No — needs server because ..."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives / Prior Art
      description: Similar tools or references
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I checked existing tools in `src/toolCategories.json` and this is not a duplicate
          required: true
        - label: I would be willing to contribute a PR for this
          required: false
