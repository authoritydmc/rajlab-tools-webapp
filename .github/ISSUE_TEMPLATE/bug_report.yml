name: Bug Report
description: Report a bug or regression in Rajlab Tools
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please fill this out — it helps us fix things faster.
        For security vulnerabilities, **do not** use this form — email `raj@rajlabs.in` per `SECURITY.md`.
  - type: input
    id: route
    attributes:
      label: Tool / Route
      description: e.g., /qr-code-generator?data=hello or /merge-pdf
      placeholder: "/json-viewer"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to reproduce
      placeholder: |
        1. Go to /qr-code-generator
        2. Enter `hello` with size 400 and bg #fff
        3. Click Download → observe error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs Actual
      placeholder: Expected X, got Y. Include error messages if any.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: Browser + OS + app version (see /changelog)
      placeholder: "Chrome 126, Windows 11, v2.4.0"
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Console Errors / Screenshots
      description: Paste console errors or drag screenshots here
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I checked existing issues and this is not a duplicate
          required: true
        - label: I tested on `main` (or latest deployed version)
          required: false
